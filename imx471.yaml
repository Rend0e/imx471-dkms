# imx471.yaml for libcamera Simple IPA
# SPDX-License-Identifier: CC0-1.0
# Calibrated by hand from identity matrix and IMX471 aiqb references
%YAML 1.1
---
version: 1
algorithms:
  - BlackLevel:
      blackLevel: 4096  # From datasheet: 64 at 10-bits (4096 at 16-bits)
  - Awb:
      maxGainR: 2.38
      maxGainB: 3.47
      speed: 0.25
  - Ccm:
      ccms: # [aiqb 1] AAJH5-D_LNL, CBG802N3A_PTL, CBG802N3AP_PTL, CJFPE90P_PTL, CJFPE90_PTL
        # CCT=2702K  R/G=0.9011  B/G=0.3173 [G=88, R&B=x2.2]
        - ct: 2702
          ccm: [ 
            1.9824, 0, 0,
            0, 0.88, 0,
            0, 0, 0.6981 ]
        # CCT=2785K  R/G=0.8241  B/G=0.3263 [G=88, R&B=x2.2]
        - ct: 2785
          ccm: [ 
            1.813, 0, 0,
            0, 0.88, 0,
            0, 0, 0.7179 ]
        # CCT=3604K  R/G=0.6522  B/G=0.4079 [G=88, R&B=x2.2]
        - ct: 3604
          ccm: [ 
            1.4348, 0, 0,
            0, 0.88, 0,
            0, 0, 0.8974 ]
        # CCT=4635K  R/G=0.5841  B/G=0.5149 [G=88, R&B=x2.2]
        - ct: 4635
          ccm: [ 
            1.285, 0, 0,
            0, 0.88, 0,
            0, 0, 1.1328 ]
        # CCT=5689K  R/G=0.5043  B/G=0.6068 [G=0.68, R&B=x2.2]
        - ct: 5689
          ccm: [ 
            1.1095, 0, 0,
            0, 0.68, 0,
            0, 0, 1.335 ]

      # ccms: # [aiqb 3] TBE0020A0_AAJH5-D_PTL
      #   # CCT=2730K  R/G=0.866  B/G=0.3269 [G=88, R&B=x2.2]
      #   - ct: 2730
      #     ccm: [ 
      #       1.9052, 0, 0,
      #       0, 0.88, 0,
      #       0, 0, 0.7192 ]
      #   # CCT=2756K  R/G=0.794  B/G=0.3367 [G=88, R&B=x2.2]
      #   - ct: 2756
      #     ccm: [ 
      #       1.7468, 0, 0,
      #       0, 0.88, 0,
      #       0, 0, 0.7407 ]
      #   # CCT=3586K  R/G=0.6286  B/G=0.4196 [G=88, R&B=x2.2]
      #   - ct: 3586
      #     ccm: [ 
      #       1.3829, 0, 0,
      #       0, 0.88, 0,
      #       0, 0, 0.9231 ]
      #   # CCT=3790K  R/G=0.6062  B/G=0.4366 [G=88, R&B=x2.2]
      #   - ct: 3790
      #     ccm: [ 
      #       1.3336, 0, 0,
      #       0, 0.88, 0,
      #       0, 0, 0.9605 ]
      #   # CCT=4634K  R/G=0.5569  B/G=0.5287 [G=88, R&B=x2.2]
      #   - ct: 4634
      #     ccm: [ 
      #       1.2252, 0, 0,
      #       0, 0.88, 0,
      #       0, 0, 1.1631 ]
      #   # CCT=5776K  R/G=0.4719  B/G=0.6188 [G=0.68, R&B=x2.2]
      #   - ct: 5776
      #     ccm: [ 
      #       1.0382, 0, 0,
      #       0, 0.68, 0,
      #       0, 0, 1.3614 ]

        # - ct: 4400 #  Hand calibrated at temperature 4400K (example)
        #   ccm: [ 
        #     1.36, 0, 0,  # R 0 0 - Increase [R] 'red'   for 'warmer tone' (and/or decrease 'B')
        #     0, 1.02, 0,  # 0 G 0 - Decrease [G] 'green' to reduce green tint or increase to balance
        #     0, 0, 1.16 ] # 0 0 B - Increase [B] 'blue'  for 'cooler tone' (and/or decrease 'R')

  - Adjust: # Note: these below don't seem to have any effect...
      gamma: 2.2
      contrast: 1.0
      saturation: 1.0
  - Agc:
# LIBCAMERA_LOG_LEVELS="IPASoftAwb:DEBUG" LIBCAMERA_IPA_CONFIG_PATH=...
